spring:
  application:
    name: backend
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/XEPDB1
    username: plzjob
    password: ${DB_PASSWORD:plzjob1234}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:plz-job-secret-key-must-be-at-least-256-bits-long-please-change-in-prod}
  access-expiration: 1800000
  refresh-expiration: 1209600000
  log-token: ${JWT_LOG_TOKEN:false}   # DEV 전용: 로그인 시 발급 JWT를 로그로 출력(운영은 false 유지)

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/callback/kakao}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback/google}

llm:
  base-url: ${LLM_BASE_URL:http://localhost:11435}
  model: ${LLM_MODEL:gemma3:4b}
  keep-alive: ${LLM_KEEP_ALIVE:30m}     # 모델 상주 시간(콜드 스타트 방지). -1=무제한
  num-predict: ${LLM_NUM_PREDICT:1024}  # 출력 토큰 상한
  num-ctx: ${LLM_NUM_CTX:4096}          # 컨텍스트 길이
  temperature: ${LLM_TEMPERATURE:0.2}   # 낮을수록 JSON 형식 안정 → 재시도 감소

document:
  upload-dir: ${UPLOAD_DIR:./uploads}
